name: CI

# What this workflow asserts about openkal-platform.
#
#   tests       `mcpp test` on the platform package: the test image runs on the
#               machine's architecture and is built for the other one
#   image       a project that declares nothing builds, runs and packs an ok
#               image over this platform: the `openkal` set as one tree (vendored
#               and self-contained), one target alone, a single file and an okb
#   hosted      the machine's own triple takes the platform's hosted arrangement
#   host-graph  a build program is compiled as an ok image and run by okrun
#   i686        Linux's thirty-two bit row: the hosted program and the
#               specification's conformance suite, run on Linux x86_64
#   freebsd     the musl rows of FreeBSD are built here and run in a FreeBSD VM,
#               with okrun built for them running an ok image there
#
# The platform is read by mcpp 2026.10.30.1 and later (SPEC-013, SPEC-015). CI
# measures with 2026.10.31.3: from 2026.10.31.2 a set's Windows launcher is built
# over the platform of mcpp's own openkal rows rather than the one a project
# selects, whose version group may name another openkal than the launcher's os.
# A dispatch, or the repository variable MCPP_SOURCE_REF, may name a branch of
# mcpp instead, which the latest released mcpp builds and which is then used.
# 0.23.0 measures with 2026.11.3.1: from it the std module is compiled with
# the platform's compile words, and this platform's `-fcf-protection=full`
# recorded in an importer's command and not in the module's refused the import
# (the release candidate, through MCPP_SOURCE_REF, until it is released).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mcpp_ref:
        description: "Branch of mcpp-community/mcpp to build and test with (empty = the released mcpp)"
        required: false
        default: ""

env:
  MCPP_SOURCE_REF: ${{ github.event.inputs.mcpp_ref || vars.MCPP_SOURCE_REF || '' }}
  MCPP_VERSION: 2026.11.10.1
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # `host`: the machine's own triple, as a program of the hosted
          # arrangement names it (a Windows host defaults to the MSVC target,
          # and openkal's Windows implementation is reached through the GNU one).
          - { os: ubuntu-24.04,     arch: x86_64,  host: '' }
          - { os: ubuntu-24.04-arm, arch: aarch64, host: '' }
          - { os: macos-15,         arch: aarch64, host: '--target aarch64-macos' }
          - { os: windows-2022,     arch: x86_64,  host: '--target x86_64-windows-gnu' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings and mcpp (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings and mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The mcpp under cross-validation
        run: |
          want="mcpp@$MCPP_VERSION"
          [ -n "${MCPP_SOURCE_REF:-}" ] && want=mcpp
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "$want" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL
          if [ -n "${MCPP_SOURCE_REF:-}" ]; then
            src="$RUNNER_TEMP/mcpp-src"
            git clone --quiet --depth 1 --branch "$MCPP_SOURCE_REF" https://github.com/mcpp-community/mcpp.git "$src"
            rm -f "$src/.xlings.json"
            ( cd "$src" && mcpp build --release )
            built=$(find "$src/target" -type f \( -name mcpp -o -name mcpp.exe \) -path '*/bin/*' | head -1)
            [ -n "$built" ] || { echo "::error::mcpp did not build from $MCPP_SOURCE_REF"; exit 1; }
            echo "$(cd "$(dirname "$built")" && pwd)" >> "$GITHUB_PATH"
            echo "under review: $("$built" --version)  (from $MCPP_SOURCE_REF)"
          fi

      - name: The platform's tests
        env:
          MCPP_TOOL_BUILD_VERBOSE: '1'
        run: |
          mcpp test -v 2>&1 | tee tests.log
          grep -Eq "image_test .*ok" tests.log || { echo "::error::the test image did not run or did not pass"; exit 1; }

      - name: An ok image that declares nothing (run, the set's tree, self-contained, one target, single file, okb)
        working-directory: checks/image
        run: |
          t='${{ matrix.arch }}-openkal'
          other=x86_64; [ '${{ matrix.arch }}' = x86_64 ] && other=aarch64
          py=python3; command -v python3 > /dev/null 2>&1 && python3 -c '' 2>/dev/null || py=python
          mcpp run --target "$t" -- one two | tee run.log
          grep -q "image ok: 3 args" run.log || { echo "::error::the image's output"; exit 1; }
          okrun=$(mcpp self env --target "$t" --format json | $py -c 'import json,sys; print(json.load(sys.stdin)["data"]["runner"]["program"])')
          if [ "${{ runner.os }}" = Windows ]; then bin=bin/image.exe; else bin=bin/image; fi
          # The `openkal` set: one tree of both architectures, the launchers, the runner on PATH.
          mcpp pack --target openkal --pkg-format dir -o uni
          for f in lib/x86_64/image.oke lib/aarch64/image.oke bin/image bin/image.exe mcpp-package.json; do
            [ -f "target/dist/uni/$f" ] || { echo "::error::the set's tree has no $f"; exit 1; }
          done
          okdir=$(dirname "$okrun")
          if [ "${{ runner.os }}" = Windows ]; then okdir=$(cygpath -u "$okdir"); fi
          PATH="$okdir:$PATH" "target/dist/uni/$bin" one two | tee uni.log
          grep -q "image ok: 3 args" uni.log || { echo "::error::the launcher's output"; exit 1; }
          # Self-contained: the runner inside, nothing on PATH.
          mcpp pack --target openkal --mode self-contained --pkg-format dir -o sc
          "target/dist/sc/$bin" one two | tee sc.log
          grep -q "image ok: 3 args" sc.log || { echo "::error::the self-contained tree's output"; exit 1; }
          # One target: its architecture alone, in the same layout.
          mcpp pack --target "$t" --pkg-format dir -o one
          [ -f "target/dist/one/lib/${{ matrix.arch }}/image.oke" ] || { echo "::error::one target's tree has no lib/${{ matrix.arch }}/image.oke"; exit 1; }
          [ -d "target/dist/one/lib/$other" ] && { echo "::error::one target packed lib/$other"; exit 1; }
          PATH="$okdir:$PATH" "target/dist/one/$bin" one two | tee one-tree.log
          grep -q "image ok: 3 args" one-tree.log || { echo "::error::one target's tree's output"; exit 1; }
          # One file: a program of this system carrying the image.
          mcpp pack --target "$t" --pkg-format single-file -o single
          one=
          for f in target/dist/single target/dist/single.exe; do [ -f "$f" ] && one=$f; done
          [ -n "$one" ] || { echo "::error::no single file"; exit 1; }
          "$one" one two | tee one.log
          grep -q "image ok: 3 args" one.log || { echo "::error::the single file's output"; exit 1; }
          # The okb of the set: one file of both architectures, checked and run.
          mcpp pack --target openkal --pkg-format okb --message-format json > okb.json
          okb=$($py -c 'import json; print(json.load(open("okb.json"))["data"]["artifacts"][0]["path"])')
          okld=$(mcpp self env --target "$t" --format json | $py -c 'import json,sys; print(json.load(sys.stdin)["data"]["tools"]["okld"])')
          "$okld" bundle check "$okb"
          "$okrun" "$okb" one two | tee okb.log
          grep -q "image ok: 3 args" okb.log || { echo "::error::the okb's output"; exit 1; }
          # SEALED AT ITS BASE (0.23.0): the image states a placement, and runs
          # the same placed anywhere.
          image=$(find target -path "*${{ matrix.arch }}-openkal*" -path '*bin*' -name image.oke -type f | head -1)
          "$okld" inspect "$image" | tee inspect.log
          grep -Eq '^placement +0x[0-9a-f]+, [1-8] writable' inspect.log || { echo "::error::the sealed image states no placement"; exit 1; }
          OKRUN_PLACE=0 "$okrun" "$image" one two | tee anywhere.log
          grep -q "image ok: 3 args" anywhere.log || { echo "::error::the image placed anywhere"; exit 1; }

      - name: Debug relocations and the selected debuggee runner
        run: |
          py=python3; command -v python3 > /dev/null 2>&1 && python3 -c '' 2>/dev/null || py=python
          "$py" .github/scripts/check-debug-producer.py --arch '${{ matrix.arch }}'

      - name: ThinLTO keeps thread-local storage emulated
        working-directory: checks/lto
        run: |
          t='${{ matrix.arch }}-openkal'
          other=x86_64; [ '${{ matrix.arch }}' = x86_64 ] && other=aarch64
          mcpp run --release --target "$t" | tee lto.log
          grep -q 'LTO TLS ok' lto.log || { echo "::error::LTO TLS isolation failed"; exit 1; }
          mcpp build --release --target "$other-openkal"
          py=python3; command -v python3 > /dev/null 2>&1 && python3 -c '' 2>/dev/null || py=python
          "$py" - <<'PY'
          from pathlib import Path
          for arch in ('x86_64', 'aarch64'):
              objects = list(Path('target', arch + '-openkal').rglob('main.o'))
              if not any(p.read_bytes()[:4] == b'BC\xc0\xde' for p in objects):
                  raise SystemExit('no ThinLTO bitcode object for ' + arch)
          PY

      - name: A snapshot of a C++ program's initialisers (0.23.0)
        working-directory: checks/snapshot
        run: |
          # The first start runs the initialisers and has a snapshot made; the
          # next starts from it (its phases name the snapshot) and observes the
          # same; a start whose named value the initialisers read differs runs
          # them again, and observes its own value.
          t='${{ matrix.arch }}-openkal'
          py=python3; command -v python3 > /dev/null 2>&1 && python3 -c '' 2>/dev/null || py=python
          mcpp build --release --target "$t"
          okrun=$(mcpp self env --target "$t" --format json | $py -c 'import json,sys; print(json.load(sys.stdin)["data"]["runner"]["program"])')
          image=$(find target -path "*$t*" -path '*bin*' -name snapshot.oke -type f | head -1)
          export OKRUN_CACHE="$RUNNER_TEMP/okcache"
          mkdir -p "$OKRUN_CACHE"
          "$okrun" "$image" one | tr -d '\r' | tee first.log
          grep -q -- '-- failures: 0 --' first.log || { echo "::error::the first start"; exit 1; }
          for i in $(seq 100); do grep -qs '^made\|^refused' "$OKRUN_CACHE"/*.sealing && break; sleep 0.1; done
          cat "$OKRUN_CACHE"/*.sealing
          grep -q '^made' "$OKRUN_CACHE"/*.sealing || { echo "::error::no snapshot was made"; exit 1; }
          rm -rf prof && mkdir prof
          OKRUN_PROF=phases:prof "$okrun" "$image" two | tr -d '\r' | tee second.log
          grep -q -- '-- failures: 0 --' second.log && grep -q 'local two' second.log || { echo "::error::the start from the snapshot"; exit 1; }
          grep -q '"name": "snapshot"' prof/okprof-*.json || { echo "::error::the second start did not start from the snapshot"; exit 1; }
          SNAPSHOT_CHECK_NAME=set "$okrun" "$image" three | tr -d '\r' | tee third.log
          grep -q 'named: set' third.log && grep -q -- '-- failures: 0 --' third.log \
            || { echo "::error::a start whose named value differs observed the snapshot's"; exit 1; }

      - name: The hosted arrangement
        working-directory: checks/hosted
        run: |
          mcpp run ${{ matrix.host }} -- one two | tee run.log
          grep -q "hosted ok: hosted" run.log || { echo "::error::the hosted program's output"; exit 1; }
          grep -q "hosted args: 3 two" run.log || { echo "::error::the hosted program's arguments"; exit 1; }

      - name: A build program as an ok image (the host graph)
        working-directory: checks/host-graph
        run: |
          mcpp run | tee run.log
          grep -q "host graph ok: 1" run.log || { echo "::error::the build program's definition did not arrive"; exit 1; }

  # FREEBSD (0.26.0): the hosted arrangement's musl rows, openkal-musl over
  # openkal-freebsd standalone, built here for both architectures as static
  # programs; the x86_64 one runs in a FreeBSD virtual machine, beside okrun
  # built for the same row from the openkal-image release this group names,
  # which runs an ok image there.
  # I686 (0.28.0): Linux's thirty-two bit row, which a Linux x86_64 machine runs
  # itself: the hosted program, and the specification's conformance suite through
  # the platform, over the implementation at the group's version.
  i686:
    name: i686-linux-musl (built and run on Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings and mcpp
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          export PATH="$HOME/.xlings/subos/current/bin:$PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: The hosted program, thirty-two bit
        working-directory: checks/hosted
        run: |
          mcpp run --target i686-linux-musl -- one two | tee run.log
          grep -q "hosted ok: hosted" run.log || { echo "::error::the hosted program's output"; exit 1; }
          grep -q "hosted args: 3 two" run.log || { echo "::error::the hosted program's arguments"; exit 1; }
          p=$(find target/i686-linux-musl -path '*bin/hosted' -type f | head -1)
          file "$p"
          file "$p" | grep -q 'ELF 32-bit' && file "$p" | grep -q 'Intel 80386' && file "$p" | grep -q 'statically linked' \
            || { echo "::error::i686-linux-musl is not a static i386 program"; exit 1; }

      - name: The specification's conformance suite
        run: |
          set -euo pipefail
          spec=$(sed -n 's/^openkal *= *"\(.*\)"/\1/p' mcpp.toml | head -1)
          impl=$(sed -n 's/^openkal-linux *= *"\(.*\)"/\1/p' mcpp.toml | head -1)
          git clone --quiet --depth 1 --branch "$spec" https://github.com/mcpplibs/openkal.git .spec
          git clone --quiet --depth 1 --branch "$impl" https://github.com/mcpplibs/openkal-linux.git .impl
          bash .spec/tools/run-conformance.sh openkal-linux .impl full,optional \
            --target i686-linux-musl --platform "path:$GITHUB_WORKSPACE" | tee conformance.log
          grep -qE '^observations: [0-9]+ held, 0 did not hold' conformance.log \
            || { echo "::error::an observation did not hold on i686-linux-musl"; exit 1; }

  freebsd:
    name: freebsd (built for x86_64 and aarch64, run in a VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings and mcpp
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          export PATH="$HOME/.xlings/subos/current/bin:$PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: The musl rows, built for FreeBSD
        working-directory: checks/hosted
        run: |
          mkdir -p ../../.fb
          for a in x86_64 aarch64; do
            mcpp build --target "$a-freebsd-musl"
            p=$(find "target/$a-freebsd-musl" -path '*bin/hosted' -type f | head -1)
            file "$p"
            file "$p" | grep -q 'FreeBSD' && file "$p" | grep -q 'statically linked' \
              || { echo "::error::$a-freebsd-musl is not a static FreeBSD program"; exit 1; }
          done
          cp "$(find target/x86_64-freebsd-musl -path '*bin/hosted' -type f | head -1)" ../../.fb/hosted

      - name: okrun for FreeBSD, and an ok image
        run: |
          (cd checks/image && mcpp build --target x86_64-openkal)
          cp "$(find checks/image/target -path '*x86_64-openkal*' -path '*bin*' -name image.oke -type f | head -1)" .fb/image.oke
          tag=$(sed -n 's/^openkal-tools *= *"\(.*\)"/\1/p' mcpp.toml | head -1)
          git clone --quiet --depth 1 --branch "$tag" https://github.com/mcpplibs/openkal-image.git "$RUNNER_TEMP/oi"
          printf '\n[target.x86_64-freebsd-musl]\nplatform = { path = "%s" }\ntoolchain = "llvm@23.1.3"\n' "$GITHUB_WORKSPACE" >> "$RUNNER_TEMP/oi/tools/mcpp.toml"
          (cd "$RUNNER_TEMP/oi/tools" && mcpp build --release --target x86_64-freebsd-musl)
          cp "$(find "$RUNNER_TEMP/oi/target/x86_64-freebsd-musl" -path '*bin/openkal-tools/okrun' -type f | head -1)" .fb/okrun
          file .fb/okrun

      - name: Run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            set -e
            uname -a
            ./.fb/hosted one two > .fb/hosted.log 2>&1 || echo "status $?" >> .fb/hosted.log
            ./.fb/okrun ./.fb/image.oke one two > .fb/image.log 2>&1 || echo "status $?" >> .fb/image.log
            cat .fb/hosted.log .fb/image.log

      - name: The verdict
        run: |
          grep -q "hosted ok: hosted" .fb/hosted.log && grep -q "hosted args: 3 two" .fb/hosted.log \
            || { echo "::error::the FreeBSD musl program's output"; cat .fb/hosted.log; exit 1; }
          grep -q "image ok: 3 args" .fb/image.log \
            || { echo "::error::the ok image under okrun on FreeBSD"; cat .fb/image.log; exit 1; }
