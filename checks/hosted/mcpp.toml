# The hosted arrangement (mcpp SPEC-013 §5.4): this machine's own triple takes
# the platform's toolchain, C library and C++ run-time over the system's openkal
# implementation. The platform is the directory above.
[package]
name    = "hosted"
version = "0.1.0"

[target.'cfg(any(linux, macos, windows, os = "freebsd"))']
platform = { path = "../.." }

# FreeBSD's musl rows are served from mcpp 2026.11.10.2; an earlier mcpp lists
# them as planned and takes them when the toolchain is named.
[target.x86_64-freebsd-musl]
toolchain = "llvm@23.1.3"

[target.aarch64-freebsd-musl]
toolchain = "llvm@23.1.3"

# Linux's thirty-two bit row (0.28.0): an mcpp that registers the row as planned
# takes it when the toolchain is named.
[target.i686-linux-musl]
toolchain = "llvm@23.1.3"
